[workspace]
name = "server-pytorch"
description = "Python environments for the Labkit-SAI project, segmentation server"
authors = ["Vladimír Ulman <vladimir.ulman@vsb.cz>"]
repository = "https://github.com/xulman/Labkit-SAI-server"

license = "BSD-2-Clause"
license-file = "../LICENSE"
readme = "../README.md"
version = "0.2.0"

platforms = [{ name = "linux-64-cuda", platform = "linux-64", cuda = "12.6" }]
channels = ["conda-forge"]
requires-pixi = ">=0.81"

[dependencies]
cuda-version = "12.6.*"
pytorch-gpu = "2.6.*"
torchvision = ">=0.21.0,<0.22"
scikit-image = ">=0.24.0,<0.25"
scikit-learn = ">=1.5.2,<2"
tifffile = ">=2024.6.18,<2025"
imagecodecs = ">=2024.9.22,<2025"
tqdm = ">=4.67.1,<5"
pandas = ">=2.2.3,<3"
albumentations = ">=1.4.20,<2"

# for InstanSeg
seaborn = ">=0.13.2,<0.14"
monai = ">=1.4.0,<2"
imageio = ">=2.11.0,<2.28.0"
edt = ">=2.4.1,<3"
numba = ">=0.61.2,<0.62"
llvmlite = ">=0.44.0,<0.45"

# for server
fastapi = ">=0.115.12,<0.116"

# for remote terminal life
lazygit = ">=0.65.1,<0.66"
sam2 = ">=1.0.0,<2"
huggingface_hub = ">=1.32.0,<2"

[pypi-dependencies]
cellpose = "==4.0.4"
instanseg-torch = "<=0.1.0"

